name: Deploy site

# Publishes docs/ to GitHub Pages whenever main changes — which is what the
# daily pipeline does when it commits a new brief.
#
# This replaces Pages' legacy Jekyll builder, which never started on this repo
# (every build returned "Page build failed" with duration 0). The Actions
# deploy path is the supported one now and skips Jekyll entirely, so docs/ is
# served exactly as rendered.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede one still queued — unlike the pipeline itself,
# there is nothing to lose by cancelling a superseded site build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
