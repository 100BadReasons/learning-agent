name: Daily Learning Brief

# Builds and publishes the brief unattended, then emails the link.
#
# Pages serves docs/ on main, so publishing is just a push — no deploy action,
# no API token to mint. The commit also gives the archive its version history
# for free.

on:
  schedule:
    # Every third day of the month at 09:40 UTC. Two deliberate choices:
    #
    # */3 resets at each month boundary, so the gap across the 31st can be one
    # or two days rather than three. Exact 3-day spacing would mean running
    # daily and having the job decide whether to proceed, which is more
    # machinery than an occasional short gap is worth.
    #
    # 09:40 rather than 11:00: the first two months of runs fired four to
    # eight HOURS after their 11:00 slot, not the 10-30 minutes the old comment
    # claimed, because the top of the hour is when everyone else's cron fires
    # too. An odd minute sits outside that queue, and the earlier slot leaves
    # room for the delay to land in the morning ET rather than mid-afternoon.
    # GitHub's free scheduler offers no guarantee either way.
    - cron: "40 9 */3 * *"
  workflow_dispatch:
    inputs:
      skip_research:
        description: "Skip the two web-research stages (cheap test run)"
        type: boolean
        default: false
      no_notify:
        description: "Build and publish without sending the email"
        type: boolean
        default: false

# The job pushes commits, so a slow run overlapping the next would race on
# data/seen.json and data/progress.json and lose one of the two writes.
concurrency:
  group: daily-learning-brief
  cancel-in-progress: false

permissions:
  contents: write  # required to push the rendered site back to main

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung run should fail visibly, not burn minutes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write runtime files from secrets
        env:
          ACRONYMS_JSON: ${{ secrets.ACRONYMS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: |
          # Base64-encoded so multi-line JSON and embedded newlines survive the
          # round trip. acronyms.json is the private glossary — it exists only
          # for the life of this job and is gitignored, so the publish step
          # below cannot pick it up.
          echo "$ACRONYMS_JSON" | base64 -d > acronyms.json
          echo "$GMAIL_TOKEN_JSON" | base64 -d > gmail_token.json
          echo "$GMAIL_CREDENTIALS_JSON" | base64 -d > gmail_credentials.json
          python -c "import json;[json.load(open(f)) for f in ['acronyms.json','gmail_token.json','gmail_credentials.json']]" \
            && echo "Runtime files decoded and parsed OK"

          # Optional — no extra recipients is the normal state, and an unset
          # secret must not fail the run.
          if [ -n "$RECIPIENTS_JSON" ]; then
            echo "$RECIPIENTS_JSON" | base64 -d > recipients.json
            python -c "import json;print(len(json.load(open('recipients.json'))),'extra recipient(s)')"
          else
            echo "No RECIPIENTS_JSON secret — mailing the primary recipient only."
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SITE_URL: https://100badreasons.github.io/learning-agent
          # Makes the Gmail OAuth helper raise instead of opening a browser
          # flow that would block until the job timeout.
          LEARNING_NON_INTERACTIVE: "1"
        run: |
          python orchestrator.py \
            ${{ inputs.skip_research && '--skip-research' || '' }} \
            ${{ inputs.no_notify && '--no-notify' || '' }}

      - name: Publish
        # Runs even when the pipeline exited non-zero: a partial day is still
        # worth publishing, and the red X above is what tells you to look.
        if: always()
        run: |
          # Belt and braces. .gitignore already excludes the glossary and
          # everything derived from it, but this job holds the decrypted
          # secret on disk, so verify rather than assume before pushing.
          for forbidden in acronyms.json gmail_token.json gmail_credentials.json recipients.json; do
            if git check-ignore -q "$forbidden"; then
              echo "OK: $forbidden is ignored"
            else
              echo "FATAL: $forbidden is NOT gitignored — refusing to push."
              exit 1
            fi
          done
          if [ -n "$(git status --porcelain data/private)" ]; then
            echo "FATAL: data/private has tracked changes — refusing to push."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/briefs data/seen.json data/progress.json
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit."
          else
            git commit -m "Brief for $(date -u +%Y-%m-%d)"
            # Rebase rather than force: a human commit landing mid-run should
            # survive, and the generated files are regenerated from data/ anyway.
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Upload run logs
        if: always()  # most useful precisely when the run failed
        uses: actions/upload-artifact@v4
        with:
          name: run-scratch
          # data/run/ holds each stage's raw output. It is gitignored, so this
          # artifact is the only way to see what the agents actually returned
          # on a failed run. It can contain glossary text — the artifact is
          # private to the repo's collaborators.
          path: data/run/
          if-no-files-found: warn
          retention-days: 14
